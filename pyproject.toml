[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securecrypt-pro"
version = "2.0.0"
authors = [
  { name="Abdelrahman Rashad", email="abdorashad21a-del@users.noreply.github.com" },
]
description = "Military-Grade Authenticated File & Folder Encryption Suite with AES-256-GCM, Argon2id, DoD Shredding, and Modern GUI"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pycryptodome>=3.20.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
securecrypt = "securecrypt.cli:main"
securecrypt-gui = "securecrypt.gui:launch_gui"
